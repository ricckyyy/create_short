<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ショート動画生成ツール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            padding: 40px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }
        
        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .preset-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1.1em;
            font-weight: bold;
        }
        
        .preset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .preset-btn small {
            display: block;
            margin-top: 5px;
            font-size: 0.8em;
            opacity: 0.9;
            font-weight: normal;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            min-height: 150px;
            font-family: inherit;
            resize: vertical;
        }
        
        .keywords-input {
            min-height: 100px;
        }
        
        .help-text {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        
        .generate-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .progress-section {
            display: none;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .progress-section.active {
            display: block;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .status-message {
            text-align: center;
            font-size: 1.1em;
            color: #333;
        }
        
        .video-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .video-card {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .video-card h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .video-info {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
        
        .download-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        
        .download-btn:hover {
            background: #5568d3;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .metadata-card {
            background: #f0f8ff;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .metadata-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .metadata-content {
            background: white;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 0.95em;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .copy-btn {
            background: #11998e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        
        .copy-btn:hover {
            background: #0d7a6f;
        }
        
        .copy-btn.copied {
            background: #38ef7d;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .videos-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .videos-table th,
        .videos-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .videos-table th {
            background: #f5f5f5;
            font-weight: bold;
        }
        
        .videos-table tr:hover {
            background: #f9f9f9;
        }
        
        .edit-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }
        
        .edit-btn:hover {
            background: #5568d3;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
        }
        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 ショート動画生成ツール</h1>
            <p>TikTok/YouTube Shorts向けの縦型動画を自動生成</p>
        </header>
        
        <div class="content">
            <!-- プリセット選択 -->
            <div class="section">
                <h2>📋 プリセット選択</h2>
                <div class="preset-buttons" id="presetButtons">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </div>
            
            <!-- フォーム -->
            <div class="section">
                <h2>✏️ 動画設定</h2>
                <form id="videoForm">
                    <div class="form-group">
                        <label for="accountName">アカウント名 *</label>
                        <input type="text" id="accountName" required placeholder="例: 心理テストラボ">
                    </div>
                    
                    <div class="form-group">
                        <label for="script">台本（各行が1シーン）*</label>
                        <textarea id="script" required placeholder="1行目: オープニング&#10;2行目: 本編開始&#10;3行目: 展開&#10;...&#10;最終行: CTA（フォロー促進など）"></textarea>
                        <div class="help-text">改行で区切って10行程度で記載してください</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="keywords">キーワード（カンマ区切り）*</label>
                        <textarea id="keywords" class="keywords-input" required placeholder="psychology, personality test, quiz, thinking, brain, mind, decision making, psychology test, personality, self discovery"></textarea>
                        <div class="help-text">Pexelsで検索する動画キーワードをカンマ区切りで入力（台本の行数以上推奨）</div>
                    </div>
                    
                    <button type="submit" class="generate-btn" id="generateBtn">🎬 動画を生成</button>
                </form>
            </div>
            
            <!-- 進捗表示 -->
            <div class="progress-section" id="progressSection">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
                <div class="status-message" id="statusMessage">処理中...</div>
            </div>
            
            <!-- 生成済み動画一覧 -->
            <div class="section">
                <h2>📹 生成済み動画</h2>
                <div class="video-list" id="videoList">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </div>
            
            <!-- 投稿用説明文 -->
            <div class="section">
                <h2>📝 投稿用説明文</h2>
                <div id="metadataSection">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </div>
            
            <!-- アナリティクス -->
            <div class="section">
                <h2>📊 アナリティクス</h2>
                <div id="analyticsSection">
                    <div id="statsCards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px;">
                        <!-- 統計カード -->
                    </div>
                    <h3 style="margin-top: 30px;">📹 動画一覧</h3>
                    <div id="videosTable">
                        <!-- 動画一覧テーブル -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // プリセット読み込み
        async function loadPresets() {
            try {
                const response = await fetch('/api/presets');
                const presets = await response.json();
                const container = document.getElementById('presetButtons');
                
                presets.forEach(preset => {
                    const btn = document.createElement('button');
                    btn.className = 'preset-btn';
                    btn.type = 'button';
                    btn.innerHTML = `
                        ${preset.name}
                        <small>${preset.description}</small>
                    `;
                    btn.onclick = () => loadPreset(preset);
                    container.appendChild(btn);
                });
            } catch (error) {
                console.error('プリセット読み込みエラー:', error);
            }
        }
        
        // プリセット適用
        function loadPreset(preset) {
            document.getElementById('accountName').value = preset.name;
            document.getElementById('keywords').value = preset.sample_keywords.join(', ');
            document.getElementById('script').focus();
        }
        
        // 動画一覧読み込み
        async function loadVideos() {
            try {
                const response = await fetch('/api/list-videos');
                const videos = await response.json();
                const container = document.getElementById('videoList');
                
                if (videos.length === 0) {
                    container.innerHTML = '<p style="text-align:center;color:#666;">まだ動画が生成されていません</p>';
                    return;
                }
                
                container.innerHTML = videos.map(video => `
                    <div class="video-card">
                        <h3>${video.filename}</h3>
                        <div class="video-info">
                            サイズ: ${(video.size / 1024 / 1024).toFixed(2)} MB<br>
                            作成日: ${new Date(video.created * 1000).toLocaleString('ja-JP')}
                        </div>
                        <button class="download-btn" onclick="downloadVideo('${video.filename}')">
                            ダウンロード
                        </button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('動画一覧読み込みエラー:', error);
            }
        }
        
        // 動画ダウンロード
        function downloadVideo(filename) {
            window.location.href = `/api/download/${filename}`;
        }
        
        // メタデータ読み込み
        async function loadMetadata() {
            try {
                const response = await fetch('/api/metadata');
                const metadataList = await response.json();
                const container = document.getElementById('metadataSection');
                
                if (metadataList.length === 0) {
                    container.innerHTML = '<p style="text-align:center;color:#666;">メタデータがまだ生成されていません</p>';
                    return;
                }
                
                container.innerHTML = metadataList.map(meta => {
                    const description = meta.description || '';
                    const tags = meta.tags ? meta.tags.join(' ') : '';
                    const fullText = `${description}\n\n${tags}`;
                    
                    return `
                        <div class="metadata-card">
                            <h3>🎬 ${meta.account}</h3>
                            <div class="metadata-content" id="metadata-${meta.slug}">${fullText}</div>
                            <button class="copy-btn" onclick="copyMetadata('${meta.slug}')">
                                📋 コピー
                            </button>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('メタデータ読み込みエラー:', error);
            }
        }
        
        // メタデータコピー
        function copyMetadata(slug) {
            const content = document.getElementById(`metadata-${slug}`).textContent;
            navigator.clipboard.writeText(content).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ コピーしました！';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('コピーエラー:', err);
                alert('コピーに失敗しました');
            });
        }
        
        // フォーム送信
        document.getElementById('videoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('accountName').value;
            const script = document.getElementById('script').value;
            const keywordsText = document.getElementById('keywords').value;
            const keywords = keywordsText.split(',').map(k => k.trim()).filter(k => k);
            
            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = true;
            generateBtn.textContent = '生成中...';
            
            const progressSection = document.getElementById('progressSection');
            progressSection.classList.add('active');
            
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, script, keywords })
                });
                
                const result = await response.json();
                
                // 進捗状況をポーリング
                const progressInterval = setInterval(async () => {
                    const progressResponse = await fetch('/api/progress');
                    const progress = await progressResponse.json();
                    
                    document.getElementById('progressFill').style.width = progress.progress + '%';
                    document.getElementById('progressFill').textContent = progress.progress + '%';
                    document.getElementById('statusMessage').textContent = progress.message;
                    
                    if (progress.status === 'completed') {
                        clearInterval(progressInterval);
                        generateBtn.disabled = false;
                        generateBtn.textContent = '🎬 動画を生成';
                        setTimeout(() => {
                            progressSection.classList.remove('active');
                            loadVideos();
                            loadMetadata();
                        }, 2000);
                    } else if (progress.status === 'error') {
                        clearInterval(progressInterval);
                        generateBtn.disabled = false;
                        generateBtn.textContent = '🎬 動画を生成';
                        alert('エラーが発生しました: ' + progress.message);
                    }
                }, 1000);
                
            } catch (error) {
                console.error('生成エラー:', error);
                generateBtn.disabled = false;
                generateBtn.textContent = '🎬 動画を生成';
                progressSection.classList.remove('active');
                alert('エラーが発生しました');
            }
        });
        
        // 初期化
        loadPresets();
        loadVideos();
        loadMetadata();
        loadAnalytics();
        
        // アナリティクス読み込み
        async function loadAnalytics() {
            try {
                // 統計情報取得
                const statsResponse = await fetch('/api/analytics/stats');
                const stats = await statsResponse.json();
                const statsContainer = document.getElementById('statsCards');
                
                if (stats.length > 0) {
                    statsContainer.innerHTML = stats.map(stat => `
                        <div class="stat-card">
                            <h3>${stat.account_name}</h3>
                            <div class="value">${stat.total_videos || 0}</div>
                            <div>動画数</div>
                            <div style="margin-top: 10px; font-size: 0.9em;">
                                平均: ${Math.round(stat.avg_views || 0)} views<br>
                                最高: ${Math.round(stat.max_views || 0)} views
                            </div>
                        </div>
                    `).join('');
                } else {
                    statsContainer.innerHTML = '<p style="text-align:center;color:#666;">データがまだありません</p>';
                }
                
                // 動画一覧取得
                const videosResponse = await fetch('/api/analytics/videos');
                const videos = await videosResponse.json();
                const videosContainer = document.getElementById('videosTable');
                
                if (videos.length > 0) {
                    videosContainer.innerHTML = `
                        <table class="videos-table">
                            <thead>
                                <tr>
                                    <th>タイトル</th>
                                    <th>アカウント</th>
                                    <th>再生数</th>
                                    <th>いいね</th>
                                    <th>コメント</th>
                                    <th>生成日</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${videos.map(video => `
                                    <tr>
                                        <td>${video.title || '無題'}</td>
                                        <td>${video.account_name}</td>
                                        <td>${video.views || 0}</td>
                                        <td>${video.likes || 0}</td>
                                        <td>${video.comments || 0}</td>
                                        <td>${new Date(video.created_at).toLocaleDateString('ja-JP')}</td>
                                        <td>
                                            <button class="edit-btn" onclick="editMetrics('${video.video_path}', ${video.views || 0}, ${video.likes || 0}, ${video.comments || 0})">
                                                編集
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    videosContainer.innerHTML = '<p style="text-align:center;color:#666;">動画がまだ生成されていません</p>';
                }
            } catch (error) {
                console.error('アナリティクス読み込みエラー:', error);
            }
        }
        
        // メトリクス編集
        function editMetrics(videoPath, currentViews, currentLikes, currentComments) {
            const views = prompt('再生数を入力:', currentViews);
            if (views === null) return;
            
            const likes = prompt('いいね数を入力:', currentLikes);
            if (likes === null) return;
            
            const comments = prompt('コメント数を入力:', currentComments);
            if (comments === null) return;
            
            // データ更新
            fetch('/api/analytics/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    video_path: videoPath,
                    views: parseInt(views),
                    likes: parseInt(likes),
                    comments: parseInt(comments)
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('✅ 更新しました！');
                    loadAnalytics();
                } else {
                    alert('❌ エラーが発生しました');
                }
            })
            .catch(error => {
                console.error('更新エラー:', error);
                alert('❌ エラーが発生しました');
            });
        }
    </script>
</body>
</html>
