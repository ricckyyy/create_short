[project]
name = "create-short"
version = "0.1.0"
description = "TikTok/YouTube Shorts向けの縦型動画自動生成ツール"
authors = [
    {name = "R-T",email = "csri16001@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "flask-cors (>=6.0.1,<7.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "moviepy (>=2.2.1,<3.0.0)",
    "pillow (<12)",
    "google-auth (<2.42)",
    "google-auth-oauthlib (>=1.2.3,<2.0.0)",
    "google-auth-httplib2 (>=0.2.1,<0.3.0)",
    "google-api-python-client (>=2.187.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
