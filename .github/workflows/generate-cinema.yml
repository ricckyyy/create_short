name: 動画生成 - 映画紹介

# このワークフローは「映画紹介」アカウントの動画を生成します
# - 毎日 6:20 AM (JST) に自動実行（他のアカウントとずらす）
# - 手動実行も可能
# - セルフホストランナーを使用

on:
  # 自動実行を一時的に無効化
  # schedule:
  #   # 毎日 UTC 21:20 (日本時間 6:20 AM) に実行
  #   - cron: '20 21 * * *'
  workflow_dispatch: # 手動実行のみ可能

jobs:
  generate-movie-video:
    runs-on: self-hosted
    timeout-minutes: 30 # 1アカウントのみなので30分
    
    permissions:
      contents: read
      actions: write
    
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4
      
      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install flask flask-cors requests moviepy pillow google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
      
      - name: 必要なディレクトリの作成
        run: |
          mkdir -p data/videos/draft data/videos/published data/audio
          mkdir -p data/scripts/history data/logs/generation data/upload
      
      - name: Ollamaサービスの起動確認
        timeout-minutes: 3
        run: |
          echo "Ollamaサービスの状態を確認中..."
          if ! curl -s http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
            echo "Ollamaが起動していません。起動を試みます..."
            nohup ollama serve > /dev/null 2>&1 &
            sleep 10
          fi
          curl http://127.0.0.1:11434/api/tags || echo "Ollama起動に失敗しました（続行します）"
      
      - name: VOICEVOXの起動確認
        timeout-minutes: 3
        run: |
          echo "VOICEVOXの状態を確認中..."
          if ! curl -s http://127.0.0.1:50021/speakers > /dev/null 2>&1; then
            echo "VOICEVOXが起動していません。Dockerコンテナを起動します..."
            docker start voicevox || docker run -d --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
            sleep 20
          fi
          curl http://127.0.0.1:50021/speakers || echo "VOICEVOX起動に失敗しました"
      
      - name: 動画生成スクリプトの実行（映画紹介）
        timeout-minutes: 20
        env:
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'gemma2:9b' }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TARGET_ACCOUNT: "映画紹介"
        run: |
          python daily_generation.py
        continue-on-error: false
      
      - name: 生成された動画のアップロード
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos-cinema-${{ github.run_number }}
          path: |
            data/videos/draft/*cinema*.mp4
            data/upload/descriptions_*cinema*.txt
            data/logs/generation/*.log
          retention-days: 7
          if-no-files-found: warn
      
      - name: ログの出力
        if: always()
        run: |
          echo "=== 映画紹介 生成ログ ==="
          if [ -f data/logs/generation/generation_$(date +%Y%m%d).log ]; then
            tail -n 30 data/logs/generation/generation_$(date +%Y%m%d).log
          else
            echo "ログファイルが見つかりません"
          fi
      
      - name: クリーンアップ
        if: always()
        run: |
          echo "一時ファイルのクリーンアップ..."
          rm -f clip*.mp4 temp_*.mp4 || true
          echo "クリーンアップ完了"
